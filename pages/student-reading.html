<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading - TalaSaAI</title>
  <link rel="stylesheet" href="../stylesheets/shared.css?v=20260316b">
  <script src="../runtime-config.js?v=20260316c"></script>
</head>
<body>
<div class="demo-banner">TalaSaAI System</div>
<div class="layout">
  <aside class="sidebar">
    <a class="sidebar-logo sidebar-logo-link" href="student-profile.html" title="Open my profile" aria-label="Open my profile">
      <h2>TalaSaAI</h2>
      <p>Student Portal</p>
    </a>
    <nav>
      <a href="student-profile.html"><span class="icon" data-icon="profile"></span><span class="nav-label">My Profile</span></a>
      <a href="student-dashboard.html"><span class="icon" data-icon="dashboard"></span><span class="nav-label">Dashboard</span></a>
      <a href="student-passage.html" class="active"><span class="icon" data-icon="passage"></span><span class="nav-label">My Passage</span></a>
      <a href="student-progress.html"><span class="icon" data-icon="progress"></span><span class="nav-label">My Progress</span></a>
      <a href="student-pre-assessment.html"><span class="icon" data-icon="assessment"></span><span class="nav-label">Pre-Assessment</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info"><strong id="sb-name">-</strong>Grade 7</div>
      <button class="logout-btn" onclick="logout()"><span class="icon" data-icon="logout"></span><span class="nav-label">Logout</span></button>
    </div>
  </aside>
  <main class="main">
    <div class="reading-shell">
      <button class="back-btn" onclick="history.back()"><span class="icon" data-icon="back"></span>Back</button>
      <div class="reading-toolbar">
        <div>
          <span class="reading-toolbar-label">Reading Time</span>
          <span class="reading-timer" id="timer">0:00</span>
        </div>
        <div id="timer-status" class="reading-status">Reading in progress...</div>
      </div>
      <div id="week-warning" class="surface-note surface-note-warn reading-warning" style="display:none"></div>
      <div class="card reading-card" id="passage-body">
        <div id="passage-meta" class="reading-card-header"></div>
        <div class="reading-area" id="passage-text"></div>
        <div class="reading-actions">
          <button class="btn btn-primary" id="next-btn" onclick="goToQuestions()">
            Done Reading - Answer Questions
          </button>
          <div class="surface-note surface-note-warn" style="margin-top:12px; text-align:left;">
            Warning: Once you proceed to answer the assessment, you will not be able to return to this reading passage.
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../api.js?v=20260316c"></script>
<script src="../mockData.js?v=20260316b"></script>
<script>
  const params = new URLSearchParams(location.search);
  const pid = params.get("id") || "p3";
  const week = ReadWiseAPI.getActiveWeek();
  const readingLockKey = "readingLocked_" + week + "_" + pid;
  const readingSecsKey = "readingSecs_" + week + "_" + pid;
  const readingQueueKey = "readingTimeQueue_v1";

  async function bootstrapPage() {
    let auth = null;
    let passage = null;
    let weeklyIds = [];

    try {
      const cachedUser = ReadWiseAPI.getCachedUser();
      auth = cachedUser ? { user: cachedUser, cached: true } : await ReadWiseAPI.me();
      if (!auth || !auth.user || auth.user.role !== "student" || !auth.user.student) {
        throw new Error("Unauthorized");
      }
      document.getElementById("sb-name").textContent = auth.user.student.name || "Student";
      const results = await Promise.all([
        ReadWiseAPI.getPassage(pid),
        ReadWiseAPI.getStudentWeeklyPassages(week)
      ]);
      passage = results[0];
      const weekly = results[1];
      weeklyIds = ((weekly && weekly.passages) || []).map(function(entry) { return entry.id; });
    } catch (error) {
      window.location.href = "../login.html";
      return;
    }

    if (!passage) {
      document.getElementById("passage-body").innerHTML =
        '<div class="surface-note surface-note-danger">Passage not found.</div>';
      return;
    }

    if (sessionStorage.getItem(readingLockKey) === "1") {
      window.location.href = "student-questions.html?id=" + encodeURIComponent(pid);
      return;
    }

    if (!weeklyIds.includes(pid)) {
      const warning = document.getElementById("week-warning");
      warning.style.display = "block";
      warning.textContent = "This passage is outside your Week " + week + " assigned list.";
    }

    document.getElementById("passage-meta").innerHTML =
      '<div class="reading-meta">' +
      '<span class="badge ' + badgeClass(passage.label) + '">' + passage.label + '</span>' +
      '<span class="badge badge-primary">' + passage.genre + '</span>' +
      '<span class="meta-pill">Week ' + week + "</span>" +
      "</div>" +
      '<h2 class="reading-title">' + passage.title + "</h2>" +
      '<div class="card-meta-row">' +
        '<span class="library-card-fact">' + passage.words + " words</span>" +
        '<span class="library-card-fact">~' + passage.time + ' min reading time</span>' +
      "</div>";

    const paraText = passage.text.split("\n").map(function(para) {
      return para.trim() ? "<p>" + para.trim() + "</p>" : "";
    }).join("");
    document.getElementById("passage-text").innerHTML = paraText;
  }

  function renderTimer() {
    const minutes = Math.floor(secs / 60);
    const seconds = secs % 60;
    document.getElementById("timer").textContent = minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
  }

  function persistReadingProgress() {
    sessionStorage.setItem(readingSecsKey, String(secs));
  }

  let secs = parseInt(sessionStorage.getItem(readingSecsKey) || "0", 10);
  if (!Number.isFinite(secs) || secs < 0) secs = 0;
  renderTimer();

  let timerInterval = setInterval(tick, 1000);
  function tick() {
    secs++;
    renderTimer();
    persistReadingProgress();
  }

  document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === "hidden") {
      persistReadingProgress();
    }
  });
  window.addEventListener("beforeunload", persistReadingProgress);

  function readQueue() {
    try {
      const raw = localStorage.getItem(readingQueueKey);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (error) {
      return [];
    }
  }

  function writeQueue(items) {
    try {
      localStorage.setItem(readingQueueKey, JSON.stringify(items));
    } catch (error) {
      // ignore storage errors
    }
  }

  function enqueueReadingPayload(payload) {
    const queue = readQueue();
    queue.push(payload);
    writeQueue(queue);
  }

  async function flushQueuedReadingTimes() {
    const queue = readQueue();
    if (!queue.length) return;

    const remaining = [];
    for (const item of queue) {
      try {
        await ReadWiseAPI.saveReadingTime(item);
      } catch (error) {
        remaining.push(item);
      }
    }
    writeQueue(remaining);
  }

  async function saveReadingTimeBestEffort(payload) {
    try {
      await ReadWiseAPI.saveReadingTime(payload);
      return true;
    } catch (error) {
      enqueueReadingPayload(payload);
      return false;
    }
  }

  function buildReadingPayload(timeStr) {
    const eventId = "rt_" + pid + "_" + week + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 10);
    return {
      eventId: eventId,
      passageId: pid,
      week: week,
      readingSeconds: secs,
      formattedTime: timeStr
    };
  }

  async function goToQuestions() {
    const confirmed = window.confirm(
      "Warning: If you continue, you will no longer be able to go back and read this assessment passage again.\n\nDo you want to proceed?"
    );
    if (!confirmed) {
      return;
    }

    clearInterval(timerInterval);
    const minutes = Math.floor(secs / 60);
    const seconds = secs % 60;
    const timeStr = minutes + ":" + (seconds < 10 ? "0" : "") + seconds;

    document.getElementById("timer-status").textContent = "Reading Time: " + timeStr;
    document.getElementById("next-btn").disabled = true;
    document.getElementById("next-btn").textContent = "Proceeding...";

    const savePayload = buildReadingPayload(timeStr);
    const saved = await saveReadingTimeBestEffort(savePayload);
    if (!saved) {
      document.getElementById("timer-status").textContent =
        "Reading Time: " + timeStr + " (saved for retry)";
    }

    sessionStorage.setItem(readingLockKey, "1");
    sessionStorage.setItem("readingTime_" + pid, timeStr);
    sessionStorage.removeItem(readingSecsKey);

    setTimeout(function() {
      window.location.href = "student-questions.html?id=" + pid;
    }, 600);
  }

  async function logout() {
    try {
      await ReadWiseAPI.logout();
    } catch (error) {
      // ignore logout API errors
    }
    sessionStorage.clear();
    window.location.href = "../login.html";
  }

  flushQueuedReadingTimes();
  window.addEventListener("online", flushQueuedReadingTimes);
  bootstrapPage();
</script>
</body>
</html>
