<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading - TalaSaAI</title>
  <link rel="stylesheet" href="../stylesheets/shared.css?v=20260316b">
  <script src="../runtime-config.js?v=20260316c"></script>
  <style>
    .reading-area { user-select: none; -webkit-user-select: none; }
    @media print { body > * { display: none !important; } }
  </style>
</head>
<body>
<div class="demo-banner">TalaSaAI System</div>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo" aria-label="Student profile section">
      <h2>TalaSaAI</h2>
      <p>Student Portal</p>
    </div>
    <nav>
      <a href="student-profile.html"><span class="icon" data-icon="profile"></span><span class="nav-label">My Profile</span></a>
      <a href="student-dashboard.html"><span class="icon" data-icon="dashboard"></span><span class="nav-label">Dashboard</span></a>
      <a href="student-passage.html" class="active"><span class="icon" data-icon="passage"></span><span class="nav-label">My Passage</span></a>
      <a href="student-progress.html"><span class="icon" data-icon="progress"></span><span class="nav-label">My Progress</span></a>
      <a href="student-pre-assessment.html"><span class="icon" data-icon="assessment"></span><span class="nav-label">Pre-Assessment</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info"><strong id="sb-name">-</strong> <span id="sb-meta">Grade 7</span></div>
      <button class="logout-btn" onclick="logout()"><span class="icon" data-icon="logout"></span><span class="nav-label">Logout</span></button>
    </div>
  </aside>
  <main class="main">
    <div class="reading-shell">
      <button class="back-btn" onclick="history.back()"><span class="icon" data-icon="back"></span>Back</button>
      <div class="reading-toolbar">
        <div>
          <span class="reading-toolbar-label">Reading Time</span>
          <span class="reading-timer" id="timer">0:00</span>
        </div>
        <div id="timer-status" class="reading-status">Reading in progress...</div>
      </div>
      <div id="week-warning" class="surface-note surface-note-warn reading-warning" style="display:none"></div>
      <div class="card reading-card" id="passage-body">
        <div id="passage-meta" class="reading-card-header"></div>
        <div class="reading-area" id="passage-text"></div>
        <div class="reading-actions">
          <button class="btn btn-primary" id="next-btn" onclick="goToQuestions()">
            Done Reading - Answer Questions
          </button>
          <div class="surface-note surface-note-warn" style="margin-top:12px; text-align:left;">
            Warning: Once you proceed to answer the assessment, you will not be able to return to this reading passage.
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../api.js?v=20260804"></script>
<script>
  (async function enforceStudentSession() {
    const role = sessionStorage.getItem("role");
    const studentId = sessionStorage.getItem("studentId");
    if (role !== "student" || !studentId) {
      try {
        let cached = (typeof ReadWiseAPI !== "undefined" && ReadWiseAPI.getCachedUser)
          ? ReadWiseAPI.getCachedUser()
          : null;
        if (!cached && typeof ReadWiseAPI !== "undefined" && typeof ReadWiseAPI.me === "function") {
          try {
            const refreshed = await ReadWiseAPI.me();
            if (refreshed && refreshed.user) cached = refreshed.user;
          } catch (e) {
            // ignore me() failures
          }
        }
        if (cached && cached.role === "student" && cached.student && cached.student.id) {
          sessionStorage.setItem("role", cached.role);
          sessionStorage.setItem("studentId", String(cached.student.id));
          return;
        }
      } catch (e) {
        // ignore and fall through to redirect
      }
      window.location.replace("../login.html");
    }
  })();

  const params = new URLSearchParams(location.search);
  const pid = params.get("id") || "p3";
  const week = awaitWeek();
  const readingLockKey = "readingLocked_" + pid;
  const readingSecsKeyBase = "readingSecs_";
  const readingQueueKey = "readingTimeQueue_v1";
  let resolvedWeek = 1;
  const readingProgressEventId = "rp_" + pid + "_wk";
  let autosaveInterval = null;
  let lastSavedProgressSecs = -1;

  function awaitWeek() {
    return Promise.resolve(ReadWiseAPI.getActiveWeek()).then(function(value) {
      return Number(value) || 1;
    });
  }

  async function bootstrapPage() {
    let auth = null;
    let passage = null;
    let weeklyIds = [];

    try {
      const cachedUser = ReadWiseAPI.getCachedUser();
      auth = cachedUser ? { user: cachedUser, cached: true } : await ReadWiseAPI.me();
      if (!auth || !auth.user || auth.user.role !== "student" || !auth.user.student) {
        throw new Error("Unauthorized");
      }
      document.getElementById("sb-name").textContent = auth.user.student.name || "Student";
      document.getElementById("sb-meta").textContent = [
        "Grade " + (auth.user.student.grade || auth.user.student.class_level || "7"),
        auth.user.student.section || auth.user.student.school || ""
      ].filter(Boolean).join(" | ");
      const activeWeek = await week;
      const results = await Promise.all([
        ReadWiseAPI.getPassage(pid),
        ReadWiseAPI.getStudentWeeklyPassages(activeWeek)
      ]);
      passage = results[0];
      const weekly = results[1];
      weeklyIds = ((weekly && weekly.passages) || []).map(function(entry) { return entry.id; });
      await hydrateTimerFromServerDraft(activeWeek);
    } catch (error) {
      if (error && (error.status === 401 || /unauthorized/i.test(error.message))) {
        window.location.href = "../login.html";
        return;
      }
      document.getElementById("passage-body").innerHTML =
        '<div class="surface-note surface-note-danger">Unable to load this passage. ' +
        (error && error.message ? String(error.message) : "Please try again later.") +
        '</div>';
      return;
    }

    if (!passage) {
      document.getElementById("passage-body").innerHTML =
        '<div class="surface-note surface-note-danger">Passage not found.</div>';
      return;
    }

    const activeWeek = await week;
    let completedIds = [];
    try {
      const completion = await ReadWiseAPI.getStudentCompletions(activeWeek);
      completedIds = (completion && completion.completedPassageIds) || [];
    } catch (error) {
      // ignore completion lookup failures and continue with lock fallback
    }

    if (completedIds.includes(pid)) {
      window.location.href = "/student-results?id=" + encodeURIComponent(pid);
      return;
    }

    if (sessionStorage.getItem(readingLockKey) === "1") {
      window.location.href = "student-questions.html?id=" + encodeURIComponent(pid);
      return;
    }

    try {
      const state = await ReadWiseAPI.getReadingProgress(activeWeek, pid);
      if (state && state.isLocked) {
        sessionStorage.setItem(readingLockKey, "1");
        window.location.href = "student-questions.html?id=" + encodeURIComponent(pid);
        return;
      }
    } catch (error) {
      // ignore and keep local fallback
    }

    if (!weeklyIds.includes(pid)) {
      const warning = document.getElementById("week-warning");
      warning.style.display = "block";
      warning.textContent = "This passage is outside your Week " + activeWeek + " assigned list. Redirecting to your assigned passages...";
      const nextBtn = document.getElementById("next-btn");
      nextBtn.disabled = true;
      nextBtn.textContent = "Not Assigned for This Week";
      document.getElementById("timer-status").textContent = "Assigned passages only.";
      if (timerInterval) clearInterval(timerInterval);
      if (autosaveInterval) clearInterval(autosaveInterval);
      setTimeout(function() {
        window.location.href = "student-passage.html";
      }, 1200);
      return;
    }

    document.getElementById("passage-meta").innerHTML =
      '<div class="reading-meta">' +
      '<span class="badge ' + badgeClass(passage.label) + '">' + passage.label + '</span>' +
      '<span class="badge badge-primary">' + passage.genre + '</span>' +
      '<span class="meta-pill">Week ' + activeWeek + "</span>" +
      "</div>" +
      '<h2 class="reading-title">' + passage.title + "</h2>" +
      '<div class="card-meta-row">' +
        '<span class="library-card-fact">' + passage.words + " words</span>" +
        '<span class="library-card-fact">~' + passage.time + ' min reading time</span>' +
      "</div>";

    const paraText = passage.text.split("\n").map(function(para) {
      return para.trim() ? "<p>" + para.trim() + "</p>" : "";
    }).join("");
    document.getElementById("passage-text").innerHTML = paraText;
  }

  function renderTimer() {
    const minutes = Math.floor(secs / 60);
    const seconds = secs % 60;
    document.getElementById("timer").textContent = minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
  }

  function getReadingSecsKey() {
    return readingSecsKeyBase + resolvedWeek + "_" + pid;
  }

  function persistReadingProgress() {
    sessionStorage.setItem(getReadingSecsKey(), String(secs));
  }

  let secs = 0;
  if (!Number.isFinite(secs) || secs < 0) secs = 0;
  renderTimer();

  let timerInterval = null;
  function tick() {
    secs++;
    renderTimer();
    persistReadingProgress();
  }

  document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === "hidden") {
      persistReadingProgress();
      saveReadingProgressBestEffort();
    }
  });
  window.addEventListener("beforeunload", function() {
    persistReadingProgress();
    saveReadingProgressBestEffort();
  });

  function readQueue() {
    try {
      const raw = localStorage.getItem(readingQueueKey);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (error) {
      return [];
    }
  }

  function writeQueue(items) {
    try {
      localStorage.setItem(readingQueueKey, JSON.stringify(items));
    } catch (error) {
      // ignore storage errors
    }
  }

  function enqueueReadingPayload(payload) {
    const queue = readQueue();
    queue.push(payload);
    writeQueue(queue);
  }

  async function flushQueuedReadingTimes() {
    const queue = readQueue();
    if (!queue.length) return;

    const remaining = [];
    for (const item of queue) {
      try {
        await ReadWiseAPI.saveReadingTime(item);
      } catch (error) {
        remaining.push(item);
      }
    }
    writeQueue(remaining);
  }

  async function saveReadingTimeBestEffort(payload) {
    try {
      await ReadWiseAPI.saveReadingTime(payload);
      return true;
    } catch (error) {
      enqueueReadingPayload(payload);
      return false;
    }
  }

  function buildReadingPayload(timeStr) {
    const eventId = "rt_" + pid + "_" + resolvedWeek + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 10);
    return {
      eventId: eventId,
      passageId: pid,
      week: resolvedWeek,
      readingSeconds: secs,
      formattedTime: timeStr
    };
  }

  async function hydrateTimerFromServerDraft(activeWeek) {
    try {
      const draft = await ReadWiseAPI.getReadingProgress(activeWeek, pid);
      const serverSecs = Number((draft && draft.readingSeconds) || 0);
      const merged = Math.max(Number(secs || 0), Number(serverSecs || 0));
      secs = merged;
      sessionStorage.setItem(getReadingSecsKey(), String(secs));
      lastSavedProgressSecs = serverSecs;
    } catch (error) {
      // ignore draft load errors and continue local-only fallback
    }
  }

  function startAutosave() {
    if (autosaveInterval) clearInterval(autosaveInterval);
    autosaveInterval = setInterval(function() {
      saveReadingProgressBestEffort();
    }, 10000);
  }

  async function saveReadingProgressBestEffort() {
    if (!Number.isFinite(secs) || secs < 0) return false;
    if (secs === lastSavedProgressSecs) return true;
    try {
      const saved = await ReadWiseAPI.saveReadingProgress({
        eventId: readingProgressEventId + "_" + resolvedWeek,
        passageId: pid,
        week: resolvedWeek,
        readingSeconds: secs
      });
      lastSavedProgressSecs = Number((saved && saved.readingSeconds) || secs);
      return true;
    } catch (error) {
      return false;
    }
  }

  async function goToQuestions() {
    const confirmed = window.confirm(
      "Warning: If you continue, you will no longer be able to go back and read this assessment passage again.\n\nDo you want to proceed?"
    );
    if (!confirmed) {
      return;
    }

    clearInterval(timerInterval);
    if (autosaveInterval) clearInterval(autosaveInterval);
    await saveReadingProgressBestEffort();
    const minutes = Math.floor(secs / 60);
    const seconds = secs % 60;
    const timeStr = minutes + ":" + (seconds < 10 ? "0" : "") + seconds;

    document.getElementById("timer-status").textContent = "Reading Time: " + timeStr;
    document.getElementById("next-btn").disabled = true;
    document.getElementById("next-btn").textContent = "Proceeding...";

    try {
      await ReadWiseAPI.lockReading({ week: resolvedWeek, passageId: pid });
    } catch (error) {
      document.getElementById("next-btn").disabled = false;
      document.getElementById("next-btn").textContent = "Done Reading - Answer Questions";
      document.getElementById("timer-status").textContent = "Unable to lock reading. Please try again.";
      return;
    }

    const savePayload = buildReadingPayload(timeStr);
    const saved = await saveReadingTimeBestEffort(savePayload);
    if (!saved) {
      document.getElementById("timer-status").textContent =
        "Reading Time: " + timeStr + " (saved for retry)";
    }

    sessionStorage.setItem(readingLockKey, "1");
    sessionStorage.setItem("readingTime_" + pid, timeStr);
    sessionStorage.removeItem(getReadingSecsKey());

    setTimeout(function() {
      window.location.href = "student-questions.html?id=" + pid;
    }, 600);
  }

  async function logout() {
    try {
      await ReadWiseAPI.logout();
    } catch (error) {
      // ignore logout API errors
    }
    sessionStorage.clear();
    window.location.href = "../login.html";
  }

  (async function initReadingPage() {
    resolvedWeek = await week;
    secs = parseInt(sessionStorage.getItem(getReadingSecsKey()) || "0", 10);
    if (!Number.isFinite(secs) || secs < 0) secs = 0;
    renderTimer();
    timerInterval = setInterval(tick, 1000);

    flushQueuedReadingTimes();
    window.addEventListener("online", flushQueuedReadingTimes);
    await bootstrapPage();
    startAutosave();
  })();

  (function protectReadingContent() {
    document.addEventListener("copy", function(event) { event.preventDefault(); });
    document.addEventListener("cut", function(event) { event.preventDefault(); });
    document.addEventListener("paste", function(event) { event.preventDefault(); });
    document.addEventListener("contextmenu", function(event) { event.preventDefault(); });
    document.addEventListener("dragstart", function(event) { event.preventDefault(); });
    document.addEventListener("selectstart", function(event) {
      if (event.target.closest && event.target.closest(".reading-area")) event.preventDefault();
    });
    document.addEventListener("keydown", function(event) {
      var key = String(event.key || "").toLowerCase();
      var modified = event.ctrlKey || event.metaKey;
      if ((modified && ["c", "x", "v", "s", "p", "u"].includes(key)) || key === "printscreen") {
        event.preventDefault();
        event.stopPropagation();
      }
    }, true);
  })();
</script>
</body>
</html>
