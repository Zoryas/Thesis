<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Passages - TalaSaAI</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../image/logo-final.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../image/logo-final.png">
  <link rel="manifest" href="../image/site.webmanifest">
  <link rel="stylesheet" href="../stylesheets/shared.css?v=20260316b">
  <link rel="stylesheet" href="../stylesheets/admin-enhancements.css?v=20260811">
  <style>
    #passage-form-card.hidden { display: none !important; }
    #passage-form-card .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(260px, 1fr));
      gap: 18px;
      align-items: start;
    }
    #passage-form-card .field-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }
    #passage-form-card .field-group .field-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--admin-muted-color);
    }
    #passage-form-card .field-group .input,
    #passage-form-card .field-group select {
      width: 100%;
      min-width: 0;
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 14px;
      box-sizing: border-box;
      border: 1px solid var(--admin-input-border);
      background: var(--admin-input-bg);
      color: var(--admin-text-color);
    }
    #passage-form-card .field-group.inline-toggle {
      display: grid;
      align-items: center;
      grid-template-columns: auto 1fr;
      grid-column: span 2;
      gap: 12px;
    }
    #passage-form-card .admin-form-footer { display:flex; justify-content:flex-end; gap:10px; margin-top:16px; }
    #passage-form-card .field-group.field-span-2 { grid-column: span 2; }
    #passage-form-card .field-note {
      display: block;
      width: 100%;
      margin-top: 6px;
      font-size: 12px;
      line-height: 1.4;
      color: var(--admin-muted-color);
      grid-column: 1 / -1;
      margin-left: 0;
    }
    #passage-form-card textarea.input { min-height: 220px; }
    @media (max-width: 1080px) {
      #passage-form-card .form-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      #passage-form-card .field-group.inline-toggle {
        grid-column: span 2;
      }
      #passage-form-card .field-note {
        margin-left: 0;
      }
    }
    @media (max-width: 1080px) {
      #passage-form-card .form-grid,
      #passage-form-card .field-group {
        width: 100%;
        max-width: 100%;
        flex: 1 1 100%;
      }
      #passage-form-card .field-group .field-label {
        width: auto;
      }
      #passage-form-card .field-note {
        margin-left: 0;
      }
    }
    .admin-panel td.col-action {
      display: flex !important;
      flex-direction: column !important;
      gap: 8px !important;
      align-items: center !important;
      justify-content: center !important;
      white-space: normal !important;
      padding-right: 0 !important;
    }
    .admin-panel td.col-action .btn {
      width: 96px !important;
      min-width: 96px !important;
      padding: 8px 10px !important;
      display: inline-flex !important;
      justify-content: center !important;
      align-items: center !important;
      height: 36px !important;
      box-sizing: border-box !important;
      text-align: center !important;
      margin: 0 !important;
    }
    .admin-panel td.col-action .btn + .btn {
      margin-left: 0 !important;
      margin-top: 8px !important;
    }
    @media (max-width: 720px) {
      .admin-panel td.col-action .btn { width: 100% !important; padding: 10px 12px !important; font-size: 13px !important; }
    }
  </style>
  <script src="../runtime-config.js?v=20260316c"></script>
</head>
<body class="admin-passages-page">
<div class="layout admin-panel">
  <aside class="sidebar">
    <div class="sidebar-logo" aria-label="Admin portal">
      <h2>TalaSaAI</h2>
      <p>Admin Portal</p>
    </div>
    <nav>
      <a href="admin-dashboard.html"><span class="icon" data-icon="dashboard"></span><span class="nav-label">Dashboard</span></a>
      <a href="admin-students.html"><span class="icon" data-icon="students"></span><span class="nav-label">Students</span></a>
      <a href="admin-teachers.html"><span class="icon" data-icon="teacher"></span><span class="nav-label">Teachers</span></a>
      <a href="admin-passages.html" class="active"><span class="icon" data-icon="library"></span><span class="nav-label">Passages</span></a>
      <a href="admin-admins.html"><span class="icon" data-icon="settings"></span><span class="nav-label">Admins</span></a>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" onclick="logout()" type="button"><span class="icon" data-icon="logout"></span><span class="nav-label">Logout</span></button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header page-header-split">
      <div class="page-header-copy">
        <p class="eyebrow">Administration</p>
        <h1>Passage Library</h1>
        <p>Create, edit, and manage reading passages across the TalaSaAI library.</p>
      </div>
      <div class="header-meta">
        <button class="btn btn-primary" type="button" onclick="openPassageModal()">Create Passage</button>
      </div>
    </div>

    <div class="card admin-form-card hidden" id="passage-form-card">
      <div class="card-header">
        <div class="card-header-copy">
          <p class="eyebrow">Passage form</p>
          <h3 id="passage-modal-title">Create Passage</h3>
        </div>
      </div>
      <div class="form-grid admin-form-grid">
        <label class="field-group">
          <span class="field-label">Title</span>
          <input id="passage-title" class="input" type="text" placeholder="Passage title">
        </label>
        <label class="field-group">
          <span class="field-label">Genre</span>
          <input id="passage-genre" class="input" type="text" placeholder="Expository">
        </label>
        <label class="field-group">
          <span class="field-label">Reading Level</span>
          <select id="passage-label" class="input">
            <option value="EASY">Easy</option>
            <option value="MODERATE">Moderate</option>
            <option value="HARD">Hard</option>
          </select>
        </label>
        <label class="field-group">
          <span class="field-label">Confidence</span>
          <input id="passage-confidence" class="input" type="number" min="0" step="0.01" placeholder="0.00">
        </label>
        <label class="field-group inline-toggle">
          <input id="passage-draft" type="checkbox">
          <span class="field-label" style="margin:0">Save as draft</span>
        </label>
      </div>
      <label class="field-group field-span-2">
        <span class="field-label">Passage Text</span>
        <textarea id="passage-text" class="input" rows="10" placeholder="Enter passage text..."></textarea>
      </label>
      <div class="passage-analysis-row">
        <button class="btn btn-secondary" type="button" id="passage-analyze-btn">Analyze Passage</button>
        <div class="passage-analysis-result" id="passage-analysis-result">Prediction will appear here after analysis.</div>
      </div>
      <div class="admin-form-footer" id="passage-form-footer">
        <button class="btn btn-outline" type="button" onclick="closePassageModal()">Cancel</button>
        <button class="btn btn-primary" type="button" id="passage-save-btn">Save passage</button>
      </div>
      <p id="passage-modal-error" class="login-error" hidden></p>
    </div>
    <div class="card admin-form-gap" style="margin-top: 24px;">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Title</th>
              <th>Genre</th>
              <th>Level</th>
              <th>Words</th>
              <th>Draft</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="passages-table"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../api.js?v=20260804"></script>
<script src="../admin-passages.js?v=20260810"></script>
</body>
</html>
